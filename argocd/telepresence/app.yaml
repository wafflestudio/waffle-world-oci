apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: telepresence
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    name: in-cluster
    namespace: telepresence
  sources:
  - repoURL: ghcr.io/telepresenceio/telepresence-oss
    chart: telepresence-oss
    targetRevision: 2.26.2
    helm:
      releaseName: traffic-manager
      valueFiles:
      - $values/argocd/telepresence/values.yaml
  - repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
