apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: wacruit
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: wacruit
  destination:
    name: in-cluster
    namespace: wacruit-prod
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/wacruit-prod
    directory:
      include: 'wacruit-*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
