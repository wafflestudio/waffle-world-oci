alloy:
  configMap:
    create: true
    content: |
      discovery.kubernetes "pod" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pod.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "replace"
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.error_only.receiver]
      }

      loki.process "error_only" {
        forward_to = [loki.write.default.receiver]

        stage.template {
          source   = "always"
          template = "1"
        }

        stage.labels {
          values = {
            always = "",
          }
        }

        # warn은 재시작/설정 리로드처럼 정상 운영 로그에도 흔히 찍혀 waffle-alert
        # ApplicationErrorLog 알림에 노이즈로 들어왔다(예: otelcol "Config updated,
        # restart service", kube-system node-problem-detector 초기화 로그가 문자열에
        # "warn"을 포함해 오탐). error/fatal/panic만 남긴다.
        stage.match {
          selector = `{always="1"} !~ "(?i)\\b(error|fatal|panic)\\b"`
          action   = "drop"
          drop_counter_reason = "not_error_level"
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

  storagePath: /tmp/alloy

  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 256Mi

controller:
  type: daemonset
  podAnnotations:
    sidecar.istio.io/inject: "false"
