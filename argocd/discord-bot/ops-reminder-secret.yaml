apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dicoco-ops-reminder
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: dicoco-ops-reminder
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dicoco-ops-reminder
