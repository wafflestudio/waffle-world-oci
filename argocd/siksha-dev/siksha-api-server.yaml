apiVersion: apps/v1
kind: Deployment
metadata:
  name: siksha-api-server
  labels:
    app: siksha-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siksha-api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: siksha-api-server
    spec:
      serviceAccountName: siksha
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/siksha-dev/siksha-api-server:141
          name: siksha-api-server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 128Mi
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siksha
---
apiVersion: v1
kind: Service
metadata:
  name: siksha-api-server
spec:
  type: ClusterIP
  selector:
    app: siksha-api-server
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: siksha-api-server
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - siksha-api-dev.wafflestudio.com
  http:
    - route:
        - destination:
            host: siksha-api-server
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
