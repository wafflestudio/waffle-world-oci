apiVersion: apps/v1
kind: Deployment
metadata:
  name: siksha-spring-server
  labels:
    app: siksha-spring-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siksha-spring-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: siksha-spring-server
    spec:
      serviceAccountName: siksha
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/siksha-dev/siksha-spring-server
          name: siksha-spring-server
          env:
            # The image defaults InitialRAMPercentage to 60, committing most of the
            # container limit at startup. Keep the same max heap but start at 25%.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k"
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              memory: 768Mi
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: siksha-dev
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siksha
---
apiVersion: v1
kind: Service
metadata:
  name: siksha-spring-server
spec:
  type: ClusterIP
  selector:
    app: siksha-spring-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: siksha-spring-server
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - siksha-server-dev.wafflestudio.com
  http:
    - route:
        - destination:
            host: siksha-spring-server
