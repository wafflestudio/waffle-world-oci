apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: waffledotcom
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: waffledotcom
  destination:
    name: in-cluster
    namespace: waffledotcom-prod
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/waffledotcom-prod
    directory:
      include: 'waffledotcom-*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
