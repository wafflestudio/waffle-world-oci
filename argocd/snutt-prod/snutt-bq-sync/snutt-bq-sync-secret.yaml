# OCI Vault의 snutt-bq-sync-prod (JSON)
#   mongo.url:   snutt DB read 권한만 있는 Mongo 계정의 접속 URL
#                예) mongodb://bq-sync:<pw>@snutt-mongo:27017/?authSource=snutt
#   mysql.url:   공유 MySQL의 snutt_prod(snutt-ev) 읽기 전용 계정 접속 URL
#                예) mysql://snutt-bq-sync:<pw>@10.0.30.217:3306/snutt_prod
#   gcp.sa-key:  snutt-792f1 서비스 계정 키 JSON (문자열)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snutt-bq-sync
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: snutt-bq-sync
    creationPolicy: Owner
    template:
      data:
        SNUTT_MONGO: '{{ .raw | fromJson | dig "mongo.url" "" }}'
        SNUTT_EV_MYSQL: '{{ .raw | fromJson | dig "mysql.url" "" }}'
        GCP_SA_KEY: '{{ .raw | fromJson | dig "gcp.sa-key" "" }}'
  data:
    - secretKey: raw
      remoteRef:
        key: snutt-bq-sync-prod
