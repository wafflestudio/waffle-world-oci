# DB 접속 정보는 snutt 앱의 Vault secret을 그대로 읽는다. 앱 비밀번호가 바뀌어도 따로 고칠 필요가 없다.
#   snutt-timetable-prod: spring.mongodb.uri                                 → Mongo
#   snutt-ev-prod:        spring.datasource.username / spring.datasource.password → 공유 MySQL의 snutt_prod
# 전용 읽기 전용 계정이 생기면 이 두 항목만 바꾼다.
#
# OCI Vault의 snutt-bq-sync-prod: snutt-792f1 서비스 계정 키 JSON 파일 내용 그대로
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snutt-bq-sync
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: snutt-bq-sync
    creationPolicy: Owner
    template:
      data:
        SNUTT_MONGO: '{{ .timetable | fromJson | dig "spring.mongodb.uri" "" }}'
        SNUTT_EV_MYSQL: '{{ $ev := .ev | fromJson }}mysql://{{ get $ev "spring.datasource.username" | urlquery }}:{{ get $ev "spring.datasource.password" | urlquery }}@10.0.30.217:3306/snutt_prod'
        GCP_SA_KEY: '{{ .gcp }}'
  data:
    - secretKey: timetable
      remoteRef:
        key: snutt-timetable-prod
    - secretKey: ev
      remoteRef:
        key: snutt-ev-prod
    - secretKey: gcp
      remoteRef:
        key: snutt-bq-sync-prod
