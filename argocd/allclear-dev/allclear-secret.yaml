apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: allclear-dev
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: allclear-dev
    creationPolicy: Owner
    template:
      data:
        HOST: '{{ .raw | fromJson | dig "HOST" "" }}'
        DB_HOST: '{{ .raw | fromJson | dig "DB_HOST" "" }}'
        DB_PORT: '{{ .raw | fromJson | dig "DB_PORT" "" }}'
        DB_USERNAME: '{{ .raw | fromJson | dig "DB_USERNAME" "" }}'
        DB_PASSWORD: '{{ .raw | fromJson | dig "DB_PASSWORD" "" }}'
        DB_NAME: '{{ .raw | fromJson | dig "DB_NAME" "" }}'
        KAKAO_CLIENT_ID: '{{ .raw | fromJson | dig "KAKAO_CLIENT_ID" "" }}'
        KAKAO_CLIENT_SECRET: '{{ .raw | fromJson | dig "KAKAO_CLIENT_SECRET" "" }}'
        JWT_SECRET_KEY: '{{ .raw | fromJson | dig "JWT_SECRET_KEY" "" }}'
        R2_ACCOUNT_ID: '{{ .raw | fromJson | dig "R2_ACCOUNT_ID" "" }}'
        R2_ACCESS_KEY_ID: '{{ .raw | fromJson | dig "R2_ACCESS_KEY_ID" "" }}'
        R2_SECRET_ACCESS_KEY: '{{ .raw | fromJson | dig "R2_SECRET_ACCESS_KEY" "" }}'
        SLACK_TOKEN_DRAGONITE: '{{ .raw | fromJson | dig "SLACK_TOKEN_DRAGONITE" "" }}'
        MAINTENANCE_MODE: '{{ .raw | fromJson | dig "MAINTENANCE_MODE" "" }}'
        REDIS_URL: '{{ .raw | fromJson | dig "REDIS_URL" "" }}'
        APP_VERSION_POLICY_API_KEY: '{{ .raw | fromJson | dig "APP_VERSION_POLICY_API_KEY" "" }}'
  data:
    - secretKey: raw
      remoteRef:
        key: allclear-dev
