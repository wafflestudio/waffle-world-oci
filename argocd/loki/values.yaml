# SingleBinary + filesystem storage.
# 이 클러스터는 이미 하나의 데이터스토어(prometheus)를 20Gi PVC로 운영하는 규모라
# object storage(S3/GCS/MinIO)를 새로 구축하는 대신 filesystem 백엔드로 시작한다.
# 로그량이 늘어나 SimpleScalable(object storage 필수)로 옮겨야 하면 그때 재검토한다.
deploymentMode: SingleBinary

loki:
  # 단일 인스턴스 + 클러스터 내부에서만 접근하므로 멀티테넌시 인증을 끈다.
  # (기본값 true인 채로 두면 모든 push/query 요청에 X-Scope-OrgID 헤더가 필요해진다)
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # loki.storage.filesystem(common.storage로 렌더링)은 common.FilesystemConfig 타입이라
  # chunks_directory/rules_directory가 정확한 필드명 — 차트 기본값 그대로 두고 건드리지 않는다.
  # (storage_config.filesystem 아래는 다른 타입(local.FSConfig)이라 directory 단일 필드를 쓴다 —
  # 이름이 같은 "filesystem" 블록이 위치에 따라 다른 스키마로 파싱되므로 혼동 주의.)
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
  # ruler(단수)가 아니라 rulerConfig가 실제 Loki 프로세스 config.yaml의 최상위 `ruler:` 섹션에
  # 렌더링되는 필드다 (templates/config.yaml의 `{{ include "loki.rulerConfig" . }}` 확인,
  # loki.ruler라는 값은 무시된다 - helm template로 실제 검증).
  rulerConfig:
    enable_api: true
    storage:
      type: local
      local:
        # kiwigrid sidecar 컨테이너(singleBinary pod 내장, env: LABEL=loki_rule, FOLDER=/rules)가
        # loki_rule="1" 라벨 붙은 ConfigMap을 감시해서 이 경로(/rules, emptyDir)에 rule 파일을
        # 채운다 — /var/loki/rules(PVC)가 아니라 반드시 이 sidecar 마운트 경로와 일치해야
        # 한다 (statefulset.yaml 렌더링으로 sc-rules-volume이 /rules에 마운트되는 것을 확인).
        directory: /rules
    # kube-prometheus-stack이 배포한 Alertmanager(v2 API)로 직접 alert를 push한다.
    # 기존 Prometheus metric alert와 같은 Alertmanager를 공유하므로, source=waffle 라벨만
    # 붙이면 argocd/prometheus/values.yaml의 alertmanager.config.route가 그대로 처리한다.
    alertmanager_url: http://prometheus-kube-prometheus-alertmanager.prometheus.svc.cluster.local:9093
    enable_alertmanager_v2: true
    evaluation_interval: 1m
    poll_interval: 1m
  limits_config:
    retention_period: 336h # 14d. prometheus retention(10d)보다 여유있게.
    # 기본값(4MB/s)이 Alloy가 클러스터 전체 pod 로그를 한꺼번에 밀어넣는 초기 backfill에서도
    # 초과되어 "ingestion rate limit exceeded"로 로그가 드롭되는 것을 실제 배포 후 확인했다.
    # ERROR 로그만 필터링(argocd/loki-alloy/values.yaml)해도 배포 직후 버스트는 여전히 있을 수
    # 있어 burst 쪽을 더 넉넉히 잡는다.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

singleBinary:
  replicas: 1
  persistence:
    storageClass: oci-bv
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # 클러스터 전체 서비스 로그가 이 단일 인스턴스로 집중되므로 512Mi는 OOM 여유가 부족해
      # 보여 1Gi로 상향. ERROR만 필터링해 유입량 자체는 줄이되, 배포 직후 버스트나 장애 시
      # 에러 폭주에도 여유를 둔다.
      memory: 1Gi
  podAnnotations:
    sidecar.istio.io/inject: "false"

# nginx gateway는 read/write path 분리(SimpleScalable/Distributed)를 위한 컴포넌트.
# SingleBinary는 서비스 하나로 충분하므로 끈다.
gateway:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# 이 규모(수 GB/day 미만)에서는 memcached 캐시가 오버스펙이라 끈다.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# 내장 오브젝트 스토리지(MinIO)는 filesystem 모드를 쓰므로 불필요.
minio:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false

# SingleBinary 모드에서는 ruler가 별도 Deployment가 아니라 singleBinary 프로세스 자체가
# `-target=all`로 겸한다. 헬름차트의 ruler.directories 편의 기능은 templates/ruler/
# configmap-ruler.yaml이 `{{- if $isDistributed }}`로 감싸져 있어 SingleBinary/SimpleScalable
# 모드에서는 렌더링되지 않는다(helm template로 실제 확인: 빈 결과). 대신 singleBinary pod에는
# kiwigrid k8s-sidecar 컨테이너가 이미 내장되어 있어 `loki_rule` 라벨이 붙은 ConfigMap을 감시,
# /rules(emptyDir, loki.ruler.storage.local.directory와 동일 경로)에 자동으로 파일을 채워준다.
# 그 ConfigMap은 argocd/loki/resources.yaml에서 raw manifest로 직접 관리한다
# (이 레포의 prometheus alert-rules.yaml과 같은 패턴).
