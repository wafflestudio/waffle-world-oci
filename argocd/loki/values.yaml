# SingleBinary + filesystem storage.
# 이 클러스터는 이미 하나의 데이터스토어(prometheus)를 20Gi PVC로 운영하는 규모라
# object storage(S3/GCS/MinIO)를 새로 구축하는 대신 filesystem 백엔드로 시작한다.
# 로그량이 늘어나 SimpleScalable(object storage 필수)로 옮겨야 하면 그때 재검토한다.
deploymentMode: SingleBinary

loki:
  # 단일 인스턴스 + 클러스터 내부에서만 접근하므로 멀티테넌시 인증을 끈다.
  # (기본값 true인 채로 두면 모든 push/query 요청에 X-Scope-OrgID 헤더가 필요해진다)
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    filesystem:
      # 차트 기본값(chunks_directory/rules_directory)이 Loki 3.x 바이너리가 기대하는
      # local.FSConfig 스키마(directory 단일 필드)와 어긋나 "field not found" 파싱
      # 에러로 크래시했다 (실제 클러스터 배포 후 발견). 헬름 values는 deep-merge되므로
      # 구식 필드를 단순 override가 아니라 null로 명시적으로 지워야 config.yaml에서
      # 사라진다.
      chunks_directory: null
      rules_directory: null
      directory: /var/loki/chunks
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
  ruler:
    enable_api: true
    storage:
      type: local
      local:
        directory: /var/loki/rules
  limits_config:
    retention_period: 336h # 14d. prometheus retention(10d)보다 여유있게.

singleBinary:
  replicas: 1
  persistence:
    storageClass: oci-bv
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  podAnnotations:
    sidecar.istio.io/inject: "false"

# nginx gateway는 read/write path 분리(SimpleScalable/Distributed)를 위한 컴포넌트.
# SingleBinary는 서비스 하나로 충분하므로 끈다.
gateway:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# 이 규모(수 GB/day 미만)에서는 memcached 캐시가 오버스펙이라 끈다.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# 내장 오브젝트 스토리지(MinIO)는 filesystem 모드를 쓰므로 불필요.
minio:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
