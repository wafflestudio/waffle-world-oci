# SingleBinary + filesystem storage.
# 이 클러스터는 이미 하나의 데이터스토어(prometheus)를 20Gi PVC로 운영하는 규모라
# object storage(S3/GCS/MinIO)를 새로 구축하는 대신 filesystem 백엔드로 시작한다.
# 로그량이 늘어나 SimpleScalable(object storage 필수)로 옮겨야 하면 그때 재검토한다.
deploymentMode: SingleBinary

loki:
  # 단일 인스턴스 + 클러스터 내부에서만 접근하므로 멀티테넌시 인증을 끈다.
  # (기본값 true인 채로 두면 모든 push/query 요청에 X-Scope-OrgID 헤더가 필요해진다)
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  # loki.storage.filesystem(common.storage로 렌더링)은 common.FilesystemConfig 타입이라
  # chunks_directory/rules_directory가 정확한 필드명 — 차트 기본값 그대로 두고 건드리지 않는다.
  # (storage_config.filesystem 아래는 다른 타입(local.FSConfig)이라 directory 단일 필드를 쓴다 —
  # 이름이 같은 "filesystem" 블록이 위치에 따라 다른 스키마로 파싱되므로 혼동 주의.)
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
  ruler:
    enable_api: true
    storage:
      type: local
      local:
        directory: /var/loki/rules
  limits_config:
    retention_period: 336h # 14d. prometheus retention(10d)보다 여유있게.
    # 기본값(4MB/s)이 Alloy가 클러스터 전체 pod 로그를 한꺼번에 밀어넣는 초기 backfill에서도
    # 초과되어 "ingestion rate limit exceeded"로 로그가 드롭되는 것을 실제 배포 후 확인했다.
    # ERROR 로그만 필터링(argocd/loki-alloy/values.yaml)해도 배포 직후 버스트는 여전히 있을 수
    # 있어 burst 쪽을 더 넉넉히 잡는다.
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32

singleBinary:
  replicas: 1
  persistence:
    storageClass: oci-bv
    accessModes: ["ReadWriteOnce"]
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # 클러스터 전체 서비스 로그가 이 단일 인스턴스로 집중되므로 512Mi는 OOM 여유가 부족해
      # 보여 1Gi로 상향. ERROR만 필터링해 유입량 자체는 줄이되, 배포 직후 버스트나 장애 시
      # 에러 폭주에도 여유를 둔다.
      memory: 1Gi
  podAnnotations:
    sidecar.istio.io/inject: "false"

# nginx gateway는 read/write path 분리(SimpleScalable/Distributed)를 위한 컴포넌트.
# SingleBinary는 서비스 하나로 충분하므로 끈다.
gateway:
  enabled: false

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# 이 규모(수 GB/day 미만)에서는 memcached 캐시가 오버스펙이라 끈다.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# 내장 오브젝트 스토리지(MinIO)는 filesystem 모드를 쓰므로 불필요.
minio:
  enabled: false

test:
  enabled: false
lokiCanary:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
  lokiCanary:
    enabled: false
