apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: top-level
spec:
  project: default
  destination:
    name: in-cluster
    namespace: argocd
  ignoreDifferences:
  - group: argoproj.io
    kind: Application
    name: telepresence
    namespace: argocd
    jqPathExpressions:
    - .metadata.finalizers
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      include: '*/app.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
