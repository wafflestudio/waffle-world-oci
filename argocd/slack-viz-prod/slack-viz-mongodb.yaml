apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slack-viz-mongodb
  labels:
    app: slack-viz-mongodb
spec:
  serviceName: slack-viz-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: slack-viz-mongodb
  template:
    metadata:
      labels:
        app: slack-viz-mongodb
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - image: mongo:7
        name: mongodb
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: root
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: slack-viz-prod
              key: MONGO_ROOT_PASSWORD
        - name: MONGO_INITDB_DATABASE
          value: slack
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: slack-viz-mongodb
spec:
  type: ClusterIP
  selector:
    app: slack-viz-mongodb
  ports:
  - port: 27017
    targetPort: 27017
