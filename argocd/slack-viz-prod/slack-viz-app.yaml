apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-viz-app
  labels:
    app: slack-viz-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-viz-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: slack-viz-app
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - image: wafflestudio/slack-vuesualizer:main
        name: app
        ports:
        - containerPort: 3000
        env:
        - name: NUXT_MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: slack-viz-prod
              key: NUXT_MONGODB_URI
        - name: NUXT_PUBLIC_DEMO_WORKSPACE_TOKEN
          valueFrom:
            secretKeyRef:
              name: slack-viz-prod
              key: NUXT_DEMO_WORKSPACE_TOKEN
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: slack-viz-app
spec:
  type: ClusterIP
  selector:
    app: slack-viz-app
  ports:
  - port: 80
    targetPort: 3000
