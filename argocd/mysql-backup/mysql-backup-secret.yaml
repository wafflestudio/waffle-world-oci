apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-backup
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: mysql-backup
    creationPolicy: Owner
    template:
      data:
        MYSQL_HOST: '{{ .raw | fromJson | dig "host" "" }}'
        MYSQL_USER: '{{ .raw | fromJson | dig "user" "" }}'
        MYSQL_PWD: '{{ .raw | fromJson | dig "password" "" }}'
  data:
    - secretKey: raw
      remoteRef:
        key: mysql-backup
