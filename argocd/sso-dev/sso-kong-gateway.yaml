# Kong config converted from kustomize. Original source: waffle-world/apps/sso-dev/kong-gateway/
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
data:
  kong-config.yaml: |
    _format_version: "3.0"

    services:
    - name: account-service
      url: http://account-server.sso-dev.svc.cluster.local
      routes:
      - name: account-service
        paths:
        - /account-service/
      - name: account-web-cf
        hosts:
        - sso-dev.wafflestudio.com
        paths:
        - /api/account-service/
      plugins:
      - name: waffle-jwt-authorizer

    - name: wacruit-service
      url: http://wacruit-server.wacruit-dev.svc.cluster.local
      routes:
      - name: wacruit-web-cf
        hosts:
        - wacruit-dev.wafflestudio.com
        paths:
        - /api/
        strip_path: false
        preserve_host: true
      plugins:
      - name: waffle-jwt-authorizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong-gateway
  labels:
    app: kong-gateway
spec:
  replicas: 0
  selector:
    matchLabels:
      app: kong-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: kong-gateway
    spec:
      serviceAccountName: sso
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/sso-dev/kong-gateway:30
          name: kong-gateway
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 8000
              name: proxy
              protocol: TCP
            - containerPort: 8100
              name: metrics
              protocol: TCP
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong-config.yaml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_PORT_MAPS
              value: 80:8000
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ROUTER_FLAVOR
              value: traditional
            - name: KONG_LOG_LEVEL
              value: debug
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /status
              port: 8100
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /status
              port: 8100
              scheme: HTTP
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
---
apiVersion: v1
kind: Service
metadata:
  name: kong-gateway
spec:
  type: ClusterIP
  selector:
    app: kong-gateway
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kong-gateway
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - api-gateway-dev.wafflestudio.com
    - sso-dev.wafflestudio.com
  http:
    - route:
        - destination:
            host: kong-gateway
