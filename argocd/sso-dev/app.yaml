apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: sso-dev
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: sso
  destination:
    name: in-cluster
    namespace: sso-dev
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/sso-dev
    directory:
      include: 'sso-*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
