apiVersion: apps/v1
kind: Deployment
metadata:
  name: siksha-spring-server
  labels:
    app: siksha-spring-server
spec:
  replicas: 0
  selector:
    matchLabels:
      app: siksha-spring-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: siksha-spring-server
    spec:
      serviceAccountName: siksha
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/siksha-prod/siksha-spring-server:1
          name: siksha-spring-server
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: siksha-prod
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: siksha
---
apiVersion: v1
kind: Service
metadata:
  name: siksha-spring-server
spec:
  type: ClusterIP
  selector:
    app: siksha-spring-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: siksha-spring-server
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - siksha-server.wafflestudio.com
  http:
    - route:
        - destination:
            host: siksha-spring-server
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
