apiVersion: apps/v1
kind: Deployment
metadata:
  name: siksha-api-server
  labels:
    app: siksha-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siksha-api-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
      labels:
        app: siksha-api-server
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: siksha
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/siksha-prod/siksha-api-server
          name: siksha-api-server
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 8000
          env:
            - name: OCI_OBJECT_STORAGE_AUTH
              value: instance_principal
            - name: OCI_OBJECT_STORAGE_NAMESPACE
              value: ax1dvc8vmenm
            - name: OCI_OBJECT_STORAGE_BUCKET
              value: siksha
            - name: OCI_OBJECT_STORAGE_REGION
              value: ap-chuncheon-1
            - name: OBJECT_STORAGE_PUBLIC_BASE_URL
              value: https://objectstorage.ap-chuncheon-1.oraclecloud.com/n/ax1dvc8vmenm/b/siksha/o
          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /ping
              port: 8000
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: siksha-api-server
spec:
  type: ClusterIP
  selector:
    app: siksha-api-server
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: siksha-api-server
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - siksha-api.wafflestudio.com
  http:
    - route:
        - destination:
            host: siksha-api-server
      headers:
        request:
          set:
            X-Forwarded-Proto: "https"
