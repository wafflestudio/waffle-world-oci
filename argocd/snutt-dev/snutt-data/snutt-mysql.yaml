apiVersion: v1
kind: Service
metadata:
  name: snutt-mysql
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Endpoints
metadata:
  name: snutt-mysql
subsets:
  - addresses:
      - ip: 10.0.30.217
    ports:
      - name: mysql
        port: 3306
