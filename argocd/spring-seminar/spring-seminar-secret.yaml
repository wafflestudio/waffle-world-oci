apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-seminar
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: spring-seminar
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: spring-seminar
