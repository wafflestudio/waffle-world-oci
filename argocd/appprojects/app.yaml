apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: appprojects
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    name: in-cluster
    namespace: argocd
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/appprojects
    directory:
      include: 'projects.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
