apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: areyouhere
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: areyouhere
  destination:
    name: in-cluster
    namespace: areyouhere
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/areyouhere
    directory:
      include: 'areyouhere-*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
