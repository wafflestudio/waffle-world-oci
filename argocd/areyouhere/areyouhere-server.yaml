apiVersion: apps/v1
kind: Deployment
metadata:
  name: areyouhere-server
  labels:
    app: areyouhere-server
spec:
  replicas: 0
  selector:
    matchLabels:
      app: areyouhere-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: areyouhere-server
    spec:
      serviceAccountName: areyouhere
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/areyouhere/areyouhere-server:142
          name: areyouhere-server
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: areyouhere
imagePullSecrets:
  - name: ocir-pull-secret
---
apiVersion: v1
kind: Service
metadata:
  name: areyouhere-server
spec:
  type: ClusterIP
  selector:
    app: areyouhere-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: areyouhere-server
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - areyouhere-api.wafflestudio.com
  http:
    - route:
        - destination:
            host: areyouhere-server
