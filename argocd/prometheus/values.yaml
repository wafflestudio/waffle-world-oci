kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

alertmanager:
  # chart 기본 config(전부 "null" receiver)를 대체.
  # alert-rules.yaml에 직접 정의한 룰(source="waffle")만 waffle-alert webhook으로 forward하고,
  # kube-prometheus-stack이 기본 생성하는 룰은 전부 drop한다.
  # 채널/팀/멘션 판단은 waffle-alert가, Alertmanager는 얇은 forwarder + repeat 타이밍만 담당.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null" # 기본 룰 포함, 매칭되지 않는 alert는 전부 drop
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h # TODO: 추후 재검토
      routes:
        - matchers: ['source = "waffle"']
          receiver: waffle-alert-webhook
          routes:
            - matchers: ['severity = "critical"']
              receiver: waffle-alert-webhook
              repeat_interval: 30m # TODO: 추후 재검토
    receivers:
      - name: "null"
      - name: waffle-alert-webhook
        webhook_configs:
          - url: http://waffle-alert.waffle-alert-prod.svc.cluster.local/api/v1/alerts/webhook
            send_resolved: true
    inhibit_rules: [] # TODO: 동일 종류 얼러트에 대해 severity가 나눠지는 경우에만 설정
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        memory: 100Mi

grafana:
  enabled: true
  replicas: 1
  defaultDashboardsTimezone: Asia/Seoul
  admin:
    existingSecret: prometheus-grafana
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    GF_AUTH_GITHUB_CLIENT_SECRET:
      secretKeyRef:
        name: prometheus-grafana
        key: github-client-secret
  podAnnotations:
    sidecar.istio.io/inject: "true"
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  grafana.ini:
    server:
      root_url: https://grafana.wafflestudio.com
    auth.github:
      enabled: true
      allow_sign_up: true
      scopes: user:email,read:org
      auth_url: https://github.com/login/oauth/authorize
      token_url: https://github.com/login/oauth/access_token
      api_url: https://api.github.com/user
      allowed_organizations: wafflestudio
      client_id: 75c8b088348e91be1e97
      role_attribute_path: "contains(groups[*], '@wafflestudio/waffle-k8s-admin') && 'Admin' || 'Viewer'"

kube-state-metrics:
  replicas: 1

prometheus-node-exporter:
  enabled: true

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 10d
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: oci-bv
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    additionalScrapeConfigs:
      - job_name: "istiod"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: istiod;http-monitoring
      - job_name: "envoy-stats"
        metrics_path: /stats/prometheus
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: ".*-envoy-prom"
      - job_name: "istio-mesh"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: istio-telemetry;prometheus
      - job_name: "istio-telemetry"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: istio-telemetry;http-monitoring
      - job_name: "istio-policy"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels:
              [
                __meta_kubernetes_service_name,
                __meta_kubernetes_endpoint_port_name,
              ]
            action: keep
            regex: istio-policy;http-policy-monitoring

# Use cert-manager for admission webhook certificates instead of the default
# patch Jobs. The patch Jobs carry helm.sh/hook annotations that ArgoCD treats
# as sync hooks, causing "waiting for completion of hook Job/..." hangs.
prometheusOperator:
  enabled: true
  admissionWebhooks:
    certManager:
      enabled: true
      issuerRef:
        name: prometheus-selfsigned
        kind: Issuer
    patch:
      enabled: false
