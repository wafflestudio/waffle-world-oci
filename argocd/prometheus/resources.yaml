apiVersion: v1
kind: Namespace
metadata:
  name: prometheus
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: prometheus-selfsigned
  namespace: prometheus
spec:
  selfSigned: {}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-grafana
  namespace: prometheus
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: prometheus-grafana
    creationPolicy: Owner
    template:
      data:
        admin-user: '{{ .raw | fromJson | dig "admin-user" "" }}'
        admin-password: '{{ .raw | fromJson | dig "admin-password" "" }}'
        github-client-secret: '{{ .raw | fromJson | dig "github-client-secret" "" }}'
  data:
    - secretKey: raw
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: prometheus-grafana
        metadataPolicy: None
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: prometheus-grafana
  namespace: prometheus
spec:
  gateways:
    - istio-ingress/waffle-ingressgateway
    - mesh
  hosts:
    - grafana.wafflestudio.com
  http:
    - route:
        - destination:
            host: prometheus-grafana.prometheus.svc.cluster.local
            port:
              number: 80
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-mysql-exporter
  namespace: prometheus
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: oci-vault
    kind: ClusterSecretStore
  target:
    name: prometheus-mysql-exporter
    creationPolicy: Owner
    template:
      data:
        DATA_SOURCE_NAME: '{{ .raw | fromJson | dig "user" "" }}:{{ .raw | fromJson | dig "password" "" }}@tcp({{ .raw | fromJson | dig "host" "" }}:3306)/'
  data:
    - secretKey: raw
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: exporter_secrets
        metadataPolicy: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mysql-exporter
  namespace: prometheus
  labels:
    app: prometheus-mysql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-mysql-exporter
  template:
    metadata:
      labels:
        app: prometheus-mysql-exporter
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.16.0
          args:
            - --no-collect.info_schema.tables # 테이블별 row 수/크기 수집 비활성화 (메트릭 폭증 방지)
            - --collect.perf_schema.eventsstatements # DB별 쿼리 수, 실행시간, 에러 수 수집
            - --collect.perf_schema.eventsstatementssum # DB별 쿼리 요약 통계 수집
          ports:
            - containerPort: 9104
              name: metrics
          envFrom:
            - secretRef:
                name: prometheus-mysql-exporter
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mysql-exporter
  namespace: prometheus
  labels:
    app: prometheus-mysql-exporter
spec:
  selector:
    app: prometheus-mysql-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prometheus-mysql-exporter
  namespace: prometheus
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: prometheus-mysql-exporter
  endpoints:
    - port: metrics
      interval: 30s
