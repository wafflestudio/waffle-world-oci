apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: waffle-alert-rules
  namespace: prometheus
  labels:
    release: prometheus
spec:
  # 새 룰을 추가할 때는 labels에 반드시 `source: waffle`을 포함해야 한다.
  # Alertmanager route가 source="waffle"인 alert만 waffle-alert webhook으로 보내고
  # 나머지(= kube-prometheus-stack 기본 룰)는 전부 "null" receiver로 drop하기 때문에,
  # 이 라벨이 빠지면 알림이 아무 에러 없이 조용히 사라진다.
  # 라우팅 설정: values.yaml의 alertmanager.config.route 참고.
  groups:
    # ─────────────────────────────────────────────
    # node level alert (only infra)
    # ─────────────────────────────────────────────
    - name: waffle-alert-node
      rules:
        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 5m
          labels:
            source: waffle
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} under disk pressure"
            description: 'Node {{ $labels.node }} has DiskPressure=True for 5m.'

        - alert: NodeMemoryHighUsage
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90 # TODO: threshold 조정
          for: 5m
          labels:
            source: waffle
            severity: critical
          annotations:
            summary: "Node {{ $labels.instance }} memory usage high"
            description: 'Node {{ $labels.instance }} memory at {{ printf "%.1f" $value }}% for 5m.'

    # ─────────────────────────────────────────────
    # workload level alert (team and infra)
    # ─────────────────────────────────────────────
    - name: waffle-alert-workload
      rules:
        - alert: PodMemoryLimitHigh
          expr: |
            100 * sum by (namespace, pod) (
              container_memory_working_set_bytes{namespace=~".+-(prod|dev)", container!="", image!="", pod!=""}
            )
            /
            sum by (namespace, pod) (
              kube_pod_container_resource_limits{namespace=~".+-(prod|dev)", resource="memory", unit="byte", pod!=""} > 0
            ) > 95
          for: 30m
          labels:
            source: waffle
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} near memory limit"
            description: '{{ $labels.namespace }}/{{ $labels.pod }} memory at {{ printf "%.1f" $value }}% of limit for 30m.'

        - alert: PVCStorageHighUsage
          expr: |
            100 * (
              1 - kubelet_volume_stats_available_bytes{persistentvolumeclaim!=""}
                  / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim!=""}
            ) > 90
          for: 5m
          labels:
            source: waffle
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} storage high"
            description: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} at {{ printf "%.1f" $value }}% for 5m.'

    # ─────────────────────────────────────────────
    # DB level alert (only infra)
    # ─────────────────────────────────────────────
    - name: waffle-alert-db
      rules:
        # TODO: 실제 이상치가 어느정도인지 확인 필요
        - alert: MySQLSlowQueriesHigh
          expr: increase(mysql_global_status_slow_queries[10m]) > 10
          labels:
            source: waffle
            severity: warning
          annotations:
            summary: "MySQL slow queries high"
            description: '{{ printf "%.0f" $value }} slow queries in last 10m (threshold 10) on {{ $labels.instance }}.'
