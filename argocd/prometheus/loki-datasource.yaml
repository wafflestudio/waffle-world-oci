# prometheus-grafana의 datasource sidecar(kube-prometheus-stack 기본값으로 이미 활성화되어
# 있음: grafana.sidecar.datasources.enabled=true, label=grafana_datasource, labelValue="1")가
# 이 ConfigMap을 읽어서 Loki datasource를 등록한다.
# sidecar의 searchNamespace가 지정되지 않으면(기본 null) 자기 자신이 떠 있는 네임스페이스(prometheus)
# 안에서만 검색하므로, 이 ConfigMap도 prometheus 네임스페이스에 둔다.
# loki 자체는 별도 Application(argocd/loki)이 관리하지만, 이 ConfigMap은 grafana(prometheus
# Application 소유)에 종속된 리소스이므로 여기서 관리해 소유권 충돌을 피한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: prometheus
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        # uid를 명시적으로 고정한다 - 지정 안 하면 Grafana가 provisioning 시점마다 예측
        # 불가능한 값을 생성해, waffle-alert가 만드는 Grafana Explore 딥링크(datasource uid를
        # URL에 하드코딩해야 함)가 재배포마다 깨진다.
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc.cluster.local:3100
        isDefault: false
        editable: false
