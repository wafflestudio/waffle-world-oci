apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snuclear-prod-role
  namespace: snuclear-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments/status", "statefulsets/status"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snuclear-prod-role-binding
  namespace: snuclear-prod
subjects:
  - kind: Group
    name: ocid1.group.oc1..aaaaaaaapra2li5hpn4p4b4syjou4grgpqompxzdkbxudmbg2smm3a4p275q
roleRef:
  kind: Role
  name: snuclear-prod-role
  apiGroup: rbac.authorization.k8s.io
