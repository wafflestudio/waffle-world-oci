apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  namespace: argocd
  name: snuclear
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: snuclear # TODO: ArgoCD에 snuclear project가 생성되어 있어야 함
  destination:
    name: in-cluster
    namespace: snuclear-prod
  source:
    repoURL: https://github.com/wafflestudio/waffle-world-oci.git
    targetRevision: main
    path: argocd/snuclear-prod
    directory:
      include: 'snuclear-*.yaml'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
