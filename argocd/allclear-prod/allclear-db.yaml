apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: allclear-db
  labels:
    app: allclear-db
spec:
  serviceName: allclear-db
  replicas: 1
  selector:
    matchLabels:
      app: allclear-db
  template:
    metadata:
      labels:
        app: allclear-db
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: allclear
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: postgres
          # TODO: Pin the exact Postgres version to use in allclear.
          image: docker.io/pgvector/pgvector:pg16
          env:
            # TODO: Confirm the database name to create on first boot.
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: allclear-prod
                  key: DB_NAME
            # TODO: Confirm the Postgres username.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: allclear-prod
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: allclear-prod
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              # TODO: Confirm whether PGDATA should use a subdirectory like /var/lib/postgresql/data/pgdata.
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
            # TODO: Revisit storage size if expected DB volume grows quickly.
---
apiVersion: v1
kind: Service
metadata:
  name: allclear-db
spec:
  type: ClusterIP
  selector:
    app: allclear-db
  ports:
    - port: 5432
      targetPort: 5432
