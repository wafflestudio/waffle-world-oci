apiVersion: apps/v1
kind: Deployment
metadata:
  name: waffle-alert
  labels:
    app: waffle-alert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waffle-alert
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  revisionHistoryLimit: 4
  template:
    metadata:
      labels:
        app: waffle-alert
    spec:
      serviceAccountName: waffle-alert
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - image: yny.ocir.io/ax1dvc8vmenm/waffle-alert-prod/waffle-alert
          name: waffle-alert
          resources:
            requests:
              cpu: 10m
              memory: 384Mi
            limits:
              memory: 512Mi
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 20
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: waffle-alert
---
# waffle-alert가 쿠버네티스 API의 watch 스트림을 구독하기 위한 권한
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: waffle-alert-k8s-watch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: waffle-alert-k8s-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: waffle-alert-k8s-watch
subjects:
  - kind: ServiceAccount
    name: waffle-alert
    namespace: waffle-alert-prod
---
apiVersion: v1
kind: Service
metadata:
  name: waffle-alert
spec:
  type: ClusterIP
  selector:
    app: waffle-alert
  ports:
    - port: 80
      targetPort: 8080
---
