name: Update GitOps image tag
description: >-
  Update a kustomize overlay's image tag in this GitOps repository and push the
  change. Intended to be called from a service repository after it builds and
  pushes a new image to OCIR, replacing the registry-triggered tag bump.

inputs:
  image:
    description: 'Image repository without tag (e.g. yny.ocir.io/ax1dvc8vmenm/snutt-dev/snutt-timetable)'
    required: true
  tag:
    description: 'New image tag to set (e.g. the build number)'
    required: true
  overlay-path:
    description: 'Path to the kustomize directory within this repo (e.g. argocd/snutt-dev/snutt-timetable)'
    required: true
  private-key:
    description: 'Private key (PEM) of the waffle-image-update GitHub App'
    required: true

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: '2842871'
        private-key: ${{ inputs.private-key }}
        owner: wafflestudio
        repositories: waffle-world-oci

    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        repository: wafflestudio/waffle-world-oci
        token: ${{ steps.app-token.outputs.token }}
        path: .gitops

    - name: Set image tag and commit
      shell: bash
      working-directory: .gitops
      env:
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        OVERLAY_PATH: ${{ inputs.overlay-path }}
      run: |
        set -euo pipefail

        # Image references this overlay renders, one per line. Read as YAML
        # rather than by matching text, so an 'image:' inside a string value
        # (a manifest embedded in a ConfigMap, say) is not mistaken for a
        # container image.
        rendered_images() {
          kustomize build . | yq ea -N '.. | select(has("image")) | .image'
        }

        git config user.name 'waffle-image-update[bot]'
        git config user.email '260899885+waffle-image-update[bot]@users.noreply.github.com'

        cd "${OVERLAY_PATH}"

        # <env>/<service>, matching the existing commit messages. Taken from the
        # image rather than the overlay path, because one overlay can hold
        # several images and the path alone would not say which one changed.
        label="${IMAGE#*/*/}"

        for attempt in 1 2 3 4 5; do
          # Re-apply the edit onto the current remote tip each attempt, so a
          # concurrent update to another overlay cannot revert this one.
          git fetch --quiet origin main
          git reset --quiet --hard origin/main

          kustomize edit set image "${IMAGE}:${TAG}"

          # 'kustomize edit set image' adds a new entry instead of failing when
          # the image name matches nothing, so without this a typo in image or
          # overlay-path would commit a no-op and report success while the old
          # tag stays deployed.
          if ! rendered_images | grep -qxF "${IMAGE}:${TAG}"; then
            echo "::error::${label} does not render ${IMAGE}:${TAG}. It renders:"
            rendered_images | sort -u | sed 's/^/  /'
            exit 1
          fi

          if git diff --quiet -- kustomization.yaml; then
            echo "${label} is already at ${TAG}."
            exit 0
          fi

          git commit --quiet -m "build: update ${label} to ${TAG}" -- kustomization.yaml

          if git push --quiet origin HEAD:main; then
            exit 0
          fi

          echo "Push attempt ${attempt} failed; retrying on top of main."
          sleep $(( (RANDOM % 5) + 1 ))
        done

        echo "::error::could not push after 5 attempts"
        exit 1
